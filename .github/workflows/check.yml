name: Vérifier les événements Pokémon

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_dm:
        description: "Envoyer un DM de test à tous les abonnés (sans toucher à l'état)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-events
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lancer la vérification
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SUBSCRIBER_IDS: ${{ vars.SUBSCRIBER_IDS }}
        run: node src/run-once.js ${{ inputs.test_dm && '--test-event' || '' }}
      - name: Sauvegarder l'état
        run: |
          git config user.name "events-poke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen-events.json
          git diff --cached --quiet || git commit -m "Mise à jour des événements vus" && git push
      - name: Garder le dépôt actif (GitHub désactive les crons après 60 jours sans activité)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git commit --allow-empty -m "keepalive" && git push
          fi
